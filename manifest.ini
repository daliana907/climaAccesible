lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Versión 1.6:
- Cierre limpio del submenú en el menú Herramientas al desactivar o recargar complementos, liberando los identificadores de ventana correctamente.
- Apertura automática de la documentación según el idioma activo del usuario (español o inglés).
- Navegación por teclado perfeccionada en la ventana de configuración: soporte nativo de Escape para cancelar e Intro para guardar, con atajos mnemónicos en los botones.
Versión 1.5:
- No se podía guardar la configuración: se usaba un dato que no existía y la operación fallaba.
- El pronóstico de los próximos días se leía siempre en español, aunque NVDA estuviera en otro idioma. Ahora se traduce como el resto.
- Unas 45 frases del vocabulario meteorológico (direcciones del viento, estados del cielo, momentos del día) no estaban preparadas para traducirse. Ya lo están, y se tradujeron al inglés.
- Varios nombres técnicos del servicio meteorológico aparecían por error como texto traducible.
- La consulta del tiempo actual y la del pronóstico se repartieron en piezas con nombre: armar la petición, interpretar la respuesta y redactar cada frase.
- La parte que decide cómo se cuenta la lluvia de cada día quedó separada y con pruebas propias.
- Los textos añadidos se pasaron al español neutro del resto del complemento.
- Se añadieron 43 comprobaciones automáticas que se ejecutan solas en GitHub con cada cambio.
Versión 1.4:
- Traducciones completas a 10 idiomas (alemán, inglés, francés, italiano, japonés, polaco, portugués de Brasil, ruso, turco y chino).
- Reintentos automáticos de red y mayor tiempo de espera para evitar errores si la conexión a internet titubea.
- Manuales y documentación bilingüe.
- Agradecimiento formal a Weather Plus y Adriano Barbieri por la idea original.
Versión 1.3:
- Opción en el menú Herramientas para comprobar que ningún otro atajo interfiera.
- Mejoras en el informe de errores en nvda.log.
Versión 1.2:
- Probado y verificado con NVDA 2026.
Versión 1.1:
- Detección natural de lluvia por franjas del día (mañana, tarde o noche).
- Selección fácil de país, provincia y ciudad sin necesidad de conexión."""
