name = climaAccesible
summary = ClimaAccesible
description = """Consulta el clima actual y el pronóstico de tu ciudad con atajos de teclado. Inspirado en el concepto de Weather Plus (Adriano Barbieri y colaboradores), rediseñado y modernizado con la API abierta Open-Meteo sin requerir cuentas ni claves API."""
author = Daliana
version = 1.4
url = https://github.com/daliana907/climaAccesible
docFileName = readme.html
minimumNVDAVersion = 2019.3
lastTestedNVDAVersion = 2026.2
updateChannel = None
changelog = """Version 1.4:
- Atribución y reconocimiento: inclusión formal de créditos y agradecimientos a Weather Plus (Adriano Barbieri y colaboradores) como inspiración conceptual original.
- Internacionalización completa: integradas 10 traducciones comunitarias (francés, alemán, italiano, portugués, ruso, chino, polaco, turco, japonés e inglés) con catálogos binarios .mo compilados.
- Documentación y licencias: portada README.md bilingüe y documentación completa en inglés en doc/en/.
- Encabezados de derechos de autor y licencias GPLv2 normalizados en todos los módulos de código.
Version 1.3:
- Opcion en el menu Herramientas para auditar conflictos con otros complementos y atajos de teclado.
- Sistema de registro (log) exhaustivo en nvda.log: tiempos de respuesta HTTP, codigos de estado, parametros y transcripcion exacta de mensajes al usuario.
- Trazas completas de excepciones con exc_info=True.
- Correccion de importacion del modulo 'time' para el calculo de tiempos de respuesta de red en las consultas de clima y pronostico.
Version 1.2:
- Declaracion formal de uso de inteligencia artificial conforme al criterio 4.5 de la Guia de revision de complementos de NVDA en espanol.
- Documentacion de uso de servicios de terceros (Open-Meteo bajo licencia CC-BY 4.0) conforme al criterio 1.6.
- Actualizada compatibilidad probada con NVDA 2026.2.
Version 1.1: Deteccion natural de momentos de lluvia, probabilidad maxima diaria de precipitacion, extraccion automatica en cascada de departamentos y ciudades en configuracion, y correccion definitiva del reinicio de NVDA."""
